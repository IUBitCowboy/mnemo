# Rubric for SE1 ICEX01-FA26 (Team Best — team repo + README attribution)
#
# Team exercise: each member creates a branch, edits README.md (name +
# email), pushes, opens a PR, a teammate merges it. Each member submits
# their OWN PR URL to Canvas (not the one they approved).
#
# Canvas rubric (10 pts total):
#   Repository Setup: 2 pts — team repo created, instructor/TA added
#   Individual Contribution: 5 pts — own branch, README edited, committed,
#     pushed, opened PR. Partial (2.5) for incomplete steps.
#   Submission: 3 pts — student submitted their own PR URL in Canvas
#
# Evidence checks are 0-pt — the tool gathers GitHub-side evidence and
# the TA awards points via the three manual_review criteria below,
# matching the Canvas rubric structure.
#
# Roster: lives on the OneDrive share (FERPA — identifies students to
# course), NOT in git. CSV header: Team,TA,IU Username.
# roster_file below is a placeholder path — TAs set it to their
# OneDrive path, or pass --rubric with the roster next to submissions.

assignment: ICEX01
course: SE1
semester: FA26
type: team
total_points: 10
semester_start: 2026-08-24
canvas_points: 10
ownership_check: team
team_mode: team_best
roster_file: roster.csv   # OneDrive share, next to submissions

criteria:
  # ── Team repo + PR evidence (0 pts — evidence only) ──

  - name: "PR URL submitted to Canvas"
    points: 0
    checker: pr_url_valid
    params:
      ownership_check: team

  - name: "Valid Team Repo Established"
    points: 0
    checker: valid_student_repo
    params:
      expected_repo_pattern: "fa26_se1_team"
      github_host: github.iu.edu

  - name: "PR has commits from submitter"
    points: 0
    checker: commit_author_check
    params: {}

  - name: "Submitter created a PR in team repo"
    points: 0
    checker: team_best_attribution
    params: {}

  # ── Canvas rubric criteria (TA awards points) ──

  - name: "Repository Setup"
    points: 2
    checker: manual_review
    params:
      label: "2 pts: team repo created and instructor/TA added. 0 pts: repo not created or access not given."

  - name: "Individual Contribution"
    points: 5
    checker: manual_review
    params:
      label: "5 pts: own branch, README edited with name/email, committed, pushed, opened PR. 2.5 pts: some but not all steps. 0 pts: no evidence of contribution."

  - name: "Submission"
    points: 3
    checker: manual_review
    params:
      label: "3 pts: student submitted their own PR URL in Canvas. 0 pts: no submission or wrong URL."